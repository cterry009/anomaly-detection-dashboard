name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy scikit-learn matplotlib seaborn joblib pytest
      - run: python -m pytest -q tests
